<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1792 1024" width="1792" height="1024">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EDE9"/>
      <stop offset="40%" stop-color="#D8DED9"/>
      <stop offset="70%" stop-color="#C5D0C5"/>
      <stop offset="100%" stop-color="#8FA88A"/>
    </linearGradient>
    <!-- Fog/mist overlay -->
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(232,237,233,0)" offset="0%"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.4)" offset="50%"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.7)" offset="100%"/>
    </linearGradient>
    <!-- Sunlight ray -->
    <linearGradient id="sunray" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="rgba(212,168,83,0.25)"/>
      <stop offset="50%" stop-color="rgba(212,168,83,0.08)"/>
      <stop offset="100%" stop-color="rgba(212,168,83,0)"/>
    </linearGradient>
    <!-- Dark overlay for text readability -->
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(59,94,74,0.55)"/>
      <stop offset="60%" stop-color="rgba(59,94,74,0.45)"/>
      <stop offset="100%" stop-color="rgba(59,94,74,0.65)"/>
    </linearGradient>
    <!-- Tree trunk gradient -->
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B5E4A"/>
      <stop offset="50%" stop-color="#4A7259"/>
      <stop offset="100%" stop-color="#3B5E4A"/>
    </linearGradient>
    <linearGradient id="bark2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A7259"/>
      <stop offset="100%" stop-color="#3B5E4A"/>
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="1792" height="1024" fill="url(#sky)"/>

  <!-- Sunlight rays -->
  <polygon points="500,0 800,0 1100,1024 600,1024" fill="url(#sunray)" opacity="0.6"/>
  <polygon points="600,0 900,0 1200,1024 700,1024" fill="url(#sunray)" opacity="0.3"/>

  <!-- Background trees (far, lighter) -->
  <!-- Far redwoods -->
  <g opacity="0.3">
    <rect x="80" y="250" width="18" height="600" rx="3" fill="#6B8F72"/>
    <rect x="180" y="280" width="14" height="570" rx="3" fill="#6B8F72"/>
    <rect x="300" y="220" width="20" height="630" rx="4" fill="#6B8F72"/>
    <rect x="500" y="260" width="15" height="590" rx="3" fill="#6B8F72"/>
    <rect x="650" y="240" width="18" height="610" rx="3" fill="#6B8F72"/>
    <rect x="850" y="270" width="14" height="580" rx="3" fill="#6B8F72"/>
    <rect x="1000" y="230" width="20" height="620" rx="4" fill="#6B8F72"/>
    <rect x="1150" y="280" width="15" height="570" rx="3" fill="#6B8F72"/>
    <rect x="1300" y="250" width="18" height="600" rx="3" fill="#6B8F72"/>
    <rect x="1480" y="270" width="14" height="580" rx="3" fill="#6B8F72"/>
    <rect x="1600" y="240" width="20" height="610" rx="4" fill="#6B8F72"/>
    <rect x="1700" y="260" width="15" height="590" rx="3" fill="#6B8F72"/>
  </g>

  <!-- Mid-ground trees -->
  <g opacity="0.5">
    <rect x="120" y="300" width="22" height="550" rx="4" fill="#5A7D60"/>
    <rect x="250" y="320" width="18" height="530" rx="3" fill="#4A7259"/>
    <rect x="420" y="280" width="25" height="570" rx="5" fill="#5A7D60"/>
    <rect x="580" y="310" width="20" height="540" rx="3" fill="#4A7259"/>
    <rect x="720" y="290" width="24" height="560" rx="4" fill="#5A7D60"/>
    <rect x="900" y="330" width="18" height="520" rx="3" fill="#4A7259"/>
    <rect x="1080" y="300" width="22" height="550" rx="4" fill="#5A7D60"/>
    <rect x="1250" y="320" width="20" height="530" rx="3" fill="#4A7259"/>
    <rect x="1400" y="290" width="24" height="560" rx="4" fill="#5A7D60"/>
    <rect x="1550" y="310" width="18" height="540" rx="3" fill="#4A7259"/>
    <rect x="1670" y="300" width="22" height="550" rx="4" fill="#5A7D60"/>
  </g>

  <!-- Foreground redwood trunks (tallest, darkest) -->
  <g>
    <!-- Tree 1 -->
    <rect x="50" y="150" width="35" height="700" rx="5" fill="url(#bark)"/>
    <ellipse cx="67" cy="150" rx="30" ry="80" fill="#3B5E4A"/>
    <!-- Tree 2 -->
    <rect x="200" y="120" width="40" height="730" rx="6" fill="url(#bark2)"/>
    <ellipse cx="220" cy="120" rx="35" ry="90" fill="#3B5E4A"/>
    <!-- Tree 3 -->
    <rect x="380" y="180" width="30" height="670" rx="5" fill="url(#bark)"/>
    <ellipse cx="395" cy="180" rx="28" ry="75" fill="#3B5E4A"/>
    <!-- Tree 4 -->
    <rect x="520" y="140" width="38" height="710" rx="6" fill="url(#bark2)"/>
    <ellipse cx="539" cy="140" rx="33" ry="85" fill="#3B5E4A"/>
    <!-- Tree 5 (center, tallest) -->
    <rect x="700" y="100" width="45" height="750" rx="7" fill="url(#bark)"/>
    <ellipse cx="722" cy="100" rx="38" ry="100" fill="#3B5E4A"/>
    <!-- Tree 6 -->
    <rect x="900" y="160" width="32" height="690" rx="5" fill="url(#bark2)"/>
    <ellipse cx="916" cy="160" rx="30" ry="80" fill="#3B5E4A"/>
    <!-- Tree 7 -->
    <rect x="1050" y="130" width="40" height="720" rx="6" fill="url(#bark)"/>
    <ellipse cx="1070" cy="130" rx="35" ry="88" fill="#3B5E4A"/>
    <!-- Tree 8 -->
    <rect x="1250" y="170" width="30" height="680" rx="5" fill="url(#bark2)"/>
    <ellipse cx="1265" cy="170" rx="28" ry="78" fill="#3B5E4A"/>
    <!-- Tree 9 -->
    <rect x="1400" y="140" width="38" height="710" rx="6" fill="url(#bark)"/>
    <ellipse cx="1419" cy="140" rx="33" ry="85" fill="#3B5E4A"/>
    <!-- Tree 10 -->
    <rect x="1580" y="120" width="42" height="730" rx="6" fill="url(#bark2)"/>
    <ellipse cx="1601" cy="120" rx="36" ry="92" fill="#3B5E4A"/>
    <!-- Tree 11 (right edge) -->
    <rect x="1720" y="160" width="35" height="690" rx="5" fill="url(#bark)"/>
    <ellipse cx="1737" cy="160" rx="30" ry="80" fill="#3B5E4A"/>
  </g>

  <!-- Tree foliage/canopy (dark green circles at top of trees) -->
  <g fill="#2D4A3D" opacity="0.6">
    <circle cx="67" cy="180" r="35"/>
    <circle cx="220" cy="150" r="40"/>
    <circle cx="395" cy="210" r="30"/>
    <circle cx="539" cy="170" r="38"/>
    <circle cx="722" cy="130" r="45"/>
    <circle cx="916" cy="190" r="32"/>
    <circle cx="1070" cy="160" r="40"/>
    <circle cx="1265" cy="200" r="30"/>
    <circle cx="1419" cy="170" r="38"/>
    <circle cx="1601" cy="150" r="42"/>
    <circle cx="1737" cy="190" r="35"/>
  </g>

  <!-- Ground/forest floor -->
  <rect x="0" y="780" width="1792" height="244" fill="#2D4A3D"/>
  <rect x="0" y="780" width="1792" height="30" fill="#3B5E4A" opacity="0.5"/>

  <!-- Foreground grass/underbrush -->
  <g fill="#3B5E4A" opacity="0.4">
    <ellipse cx="150" cy="800" rx="120" ry="20"/>
    <ellipse cx="450" cy="810" rx="100" ry="15"/>
    <ellipse cx="750" cy="795" rx="130" ry="22"/>
    <ellipse cx="1050" cy="805" rx="110" ry="18"/>
    <ellipse cx="1350" cy="800" rx="120" ry="20"/>
    <ellipse cx="1650" cy="810" rx="100" ry="15"/>
  </g>

  <!-- Fog layer -->
  <rect width="1792" height="1024" fill="url(#fog)"/>

  <!-- Dark overlay for text readability -->
  <rect width="1792" height="1024" fill="url(#overlay)"/>

  <!-- Bottom vignette -->
  <linearGradient id="vignette" x1="0" y1="0.7" x2="0" y2="1">
    <stop offset="0%" stop-color="rgba(45,74,61,0)"/>
    <stop offset="100%" stop-color="rgba(45,74,61,0.8)"/>
  </linearGradient>
  <rect width="1792" height="1024" fill="url(#vignette)"/>

  <!-- Subtle warm light spot (sun breaking through) -->
  <radialGradient id="sunspot" cx="0.45" cy="0.15" r="0.25">
    <stop offset="0%" stop-color="rgba(212,168,83,0.12)"/>
    <stop offset="100%" stop-color="rgba(212,168,83,0)"/>
  </radialGradient>
  <rect width="1792" height="1024" fill="url(#sunspot)"/>
</svg>